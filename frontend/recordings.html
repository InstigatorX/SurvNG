<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#071015">
    <meta name="color-scheme" content="dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="SurvNG">
    <script>
      (() => {
        const themes = ["auto", "light", "dark"];
        const colors = { light: "#edf1f3", dark: "#071015" };
        let theme = "dark";
        try {
          const stored = localStorage.getItem("survng.theme");
          if (themes.includes(stored)) theme = stored;
        } catch {}
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const appearance = theme === "light" ? "light" : theme === "dark" ? "dark" : (prefersDark ? "dark" : "light");
        const root = document.documentElement;
        root.dataset.theme = theme;
        const themeColor = document.querySelector('meta[name="theme-color"]');
        const statusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        const colorScheme = document.querySelector('meta[name="color-scheme"]');
        if (themeColor) themeColor.setAttribute("content", colors[appearance]);
        if (statusBar) statusBar.setAttribute("content", appearance === "light" ? "default" : "black");
        if (colorScheme) colorScheme.setAttribute("content", appearance);
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml">
    <link rel="icon" href="%BASE_URL%favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" sizes="180x180">
    <title>SurvNG Recordings</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/App.jsx"></script>
  </body>
</html>
