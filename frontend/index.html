<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e1517">
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("survng.theme");
          document.documentElement.dataset.theme = ["light", "dark", "auto"].includes(stored) ? stored : "dark";
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml">
    <link rel="icon" href="%BASE_URL%favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" sizes="180x180">
    <title>SurvNG</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/App.jsx"></script>
</body>
</html>
