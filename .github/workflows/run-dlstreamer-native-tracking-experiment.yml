name: Run DL Streamer native tracking experiment patch

on:
  pull_request:
    branches:
      - v1.3-gstreamer

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'experiment/dlstreamer-native-tracking'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/dlstreamer-native-tracking
          fetch-depth: 0

      - name: Apply experiment patch
        run: python scripts/apply_native_tracking_experiment_patch.py

      - name: Remove staging helpers
        run: |
          rm -f scripts/apply_native_tracking_experiment_patch.py
          rm -f .github/workflows/apply-dlstreamer-native-tracking-experiment.yml
          rm -f .github/workflows/run-dlstreamer-native-tracking-experiment.yml

      - name: Syntax check
        run: python -m compileall -q survng tests/test_dlstreamer_native_tracking_experiment.py scripts/gstreamer-smoke.py

      - name: Commit experiment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add opt-in DL Streamer native tracking assist"
          git push origin HEAD:experiment/dlstreamer-native-tracking
