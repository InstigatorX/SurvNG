name: "Stage native replay alignment fix"

on:
  push:
    branches:
      - experiment/native-first-alignment-fix

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply replay alignment fix
        run: python3 scripts/stage_native_alignment_fix.py
      - name: Build frontend static assets
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Install Python test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt pytest anyio httpx2
      - name: Validate native evidence tests
        run: |
          ./scripts/run-tests.sh -q tests/test_native_evidence.py tests/test_native_replay_alignment.py tests/test_native_first.py
          git diff --check
          python3 -m py_compile survng/app/native_evidence.py
      - name: Commit staged fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-native-alignment-fix.yml scripts/stage_native_alignment_fix.py
          git add survng/app/native_evidence.py tests/test_native_evidence.py
          git commit -m "fix(native): calibrate replay timing before main overlays"
          git push origin HEAD:experiment/native-first-alignment-fix
