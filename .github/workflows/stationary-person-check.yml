name: Stationary person check

on:
  push:
    branches:
      - experiment/native-first-person-stationary

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt pytest anyio httpx2
      - name: Focused native stationary regression
        run: |
          mkdir -p survng/static
          ./scripts/run-tests.sh -q             tests/test_native_stationary.py             tests/test_native_first.py             tests/test_config.py             tests/test_native_admission.py             tests/test_native_spatial.py
          git diff --check
          python -m py_compile survng/app/native_motion.py survng/app/config.py
