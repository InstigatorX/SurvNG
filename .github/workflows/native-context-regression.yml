name: Native context regression
on:
  push:
    branches: [test/native-delayed-context-e2e-20260919]
    paths: [.github/workflows/native-context-regression.yml]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt pytest anyio httpx2
      - name: Reproduce against the current native-first implementation
        run: |
          .venv/bin/python -m pytest -q tests/test_native_delayed_inventory_persistence.py
