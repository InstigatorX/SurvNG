name: Native context regression
on:
  push:
    branches: [test/native-delayed-context-e2e-20260919]
    paths: [.github/workflows/native-context-regression.yml]
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies and build real static assets
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt pytest anyio httpx2
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Respect EventStore relative media references in regression
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_native_delayed_inventory_persistence.py')
          s = p.read_text()
          changes = {
              'assert saved["snapshot_path"] == str(first_cover)': 'assert saved["snapshot_path"] == first_cover.relative_to(tmp_path).as_posix()',
              'assert selected_path != str(first_cover)': 'assert selected_path != first_cover.relative_to(tmp_path).as_posix()',
              'assert Path(selected_path).exists()': 'assert (tmp_path / selected_path).exists()',
              'assert cv2.imread(selected_path).shape[:2] == (400, 800)': 'assert cv2.imread(str(tmp_path / selected_path)).shape[:2] == (400, 800)',
          }
          for before, after in changes.items():
              assert s.count(before) == 1, before
              s = s.replace(before, after)
          s = s.replace('from pathlib import Path\n', '')
          p.write_text(s)
          PY
      - name: Prove baseline source-time and hidden-cover failures
        run: |
          .venv/bin/python - <<'PY'
          import subprocess
          import xml.etree.ElementTree as ET
          result = subprocess.run([
              '.venv/bin/python', '-m', 'pytest', '-q',
              'tests/test_native_delayed_inventory_persistence.py',
              '--junitxml=/tmp/native-context-before.xml',
          ], text=True, capture_output=True)
          print(result.stdout)
          print(result.stderr)
          cases = ET.parse('/tmp/native-context-before.xml').findall('.//testcase')
          failed = [case for case in cases if case.find('failure') is not None]
          assert result.returncode == 1 and len(cases) == 2 and len(failed) == 2
          by_name = {case.attrib['name']: case.find('failure').text or '' for case in failed}
          assert 'snapshot_visible' in next(text for name, text in by_name.items() if '[False]' in name)
          assert '20' in next(text for name, text in by_name.items() if '[True]' in name)
          PY
      - name: Restrict delayed activation and preserve cover visibility
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import subprocess
          p = Path('survng/app/native_activity.py')
          assert subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip() == 'a3a40b64352052cd2f5645ef1fa1c3e0bc5736dd'
          s = p.read_text()
          changes = {
              '        self._capture_inventory()\n\n        self.last_activity = max(self.last_activity, now)': (
                  '        # A delayed admission owns a source-time context snapshot. The\n'
                  '        # live registry may now describe an unrelated scene; only ordinary\n'
                  '        # live activation may import it into this episode.\n'
                  '        if seed is None:\n'
                  '            self._capture_inventory()\n\n'
                  '        self.last_activity = max(self.last_activity, now)'
              ),
              '            visible_ids = {\n                self.registry.get(key)["track_id"]\n                for key in self.registry.confirmed(self._seen_keys)': (
                  '            visible_ids = {\n'
                  '                self.registry.get(key)["track_id"]\n'
                  '                for key in self.registry.confirmed(\n'
                  '                    self._seen_keys if seed is None else ()\n'
                  '                )'
              ),
              '        if self.event_id is not None and self.offer_evidence is not None:\n            evidence_objects = self._visible_evidence_objects()': (
                  '        # Delayed results already carry their verified cover. Never pair\n'
                  '        # current-registry boxes with an older nomination observation.\n'
                  '        if seed is None and self.event_id is not None and self.offer_evidence is not None:\n'
                  '            evidence_objects = self._visible_evidence_objects()'
              ),
          }
          for before, after in changes.items():
              assert s.count(before) == 1, before
              s = s.replace(before, after)
          ast.parse(s)
          p.write_text(s)
          p = Path('survng/app/native_event_projection.py')
          assert subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip() == '9dec508d0360c1fdb7087d49a5ed15805598d62e'
          s = p.read_text()
          before = '                        item[field] = deepcopy(existing[field])\n        else:\n            item["snapshot_visible"] = False'
          after = (
              '                        item[field] = deepcopy(existing[field])\n'
              '            else:\n'
              '                # Inventory confirms presence, not visibility on the selected\n'
              '                # raster. Only a new cover may make this annotation visible.\n'
              '                item["snapshot_visible"] = False\n'
              '        else:\n'
              '            item["snapshot_visible"] = False'
          )
          assert s.count(before) == 1
          s = s.replace(before, after)
          ast.parse(s)
          p.write_text(s)
          PY
      - name: Validate incident lifecycle, registry, admission, and cover regression suites
        run: |
          .venv/bin/python -m pytest -q tests/test_native*.py
          .venv/bin/python -m compileall -q survng/app/native_activity.py survng/app/native_event_projection.py tests/test_native_delayed_inventory_persistence.py
          git diff --check
          git diff --stat
          git diff -- survng/app/native_activity.py survng/app/native_event_projection.py
      - name: Save tested production and regression changes to staging
        run: |
          git config user.name 'SurvNG validation'
          git config user.email 'actions@users.noreply.github.com'
          git add survng/app/native_activity.py survng/app/native_event_projection.py tests/test_native_delayed_inventory_persistence.py
          git diff --cached --check
          git commit -m 'fix(native): preserve incident source-time and cover visibility'
          git push origin HEAD:refs/heads/test/native-delayed-context-e2e-20260919
          git log -1 --format='%H %s'
