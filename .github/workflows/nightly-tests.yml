name: Nightly tests

on:
  schedule:
    # After runner maintenance (05:00 UTC); avoid overlapping heavy jobs.
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-python:
    # Node 24 actions require Actions Runner >= 2.327.1.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Free runner disk space
        run: scripts/github-runner-cleanup.sh --publish
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build frontend static assets
        run: npm --prefix frontend run build
      - name: Install Python test dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt pytest anyio httpx2
      - name: Run full Python test suite
        env:
          SURVNG_TEST_TIMEOUT_SECONDS: "5400"
        run: scripts/run-tests.sh tests/test_*.py
      - name: Run frontend unit tests
        run: node frontend/tests/run-tests.mjs unit
      - name: Post-job cleanup
        if: always()
        run: scripts/github-runner-cleanup.sh --publish

  benchmarks:
    # Record-only baseline; no regression thresholds until ~2 weeks of data.
    # Runs after the test job (pass or fail) so it never shares the runner
    # with the test suite.
    needs: full-python
    if: ${{ always() }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Free runner disk space
        run: scripts/github-runner-cleanup.sh --publish
      - name: Install Python benchmark dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
      - name: Run nightly benchmarks
        run: .venv/bin/python scripts/run-benchmarks.py --repetitions 3 --output benchmark-results/nightly-benchmarks.json
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightly-benchmarks-${{ github.run_number }}
          path: benchmark-results/nightly-benchmarks.json
          if-no-files-found: warn
          retention-days: 90
      - name: Post-job cleanup
        if: always()
        run: scripts/github-runner-cleanup.sh --publish
