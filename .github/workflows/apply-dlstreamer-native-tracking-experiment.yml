name: Apply DL Streamer native tracking experiment

on:
  push:
    branches:
      - experiment/dlstreamer-native-tracking

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/dlstreamer-native-tracking
          fetch-depth: 0

      - name: Apply experiment patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "survng/app/config.py",
              '''class DetectorConfig(BaseModel):
              enabled: bool = False
              # Retained for native continuous-inference integrations; production capture
              # is frames-only and qualification schedules inference in the shared pool.
              live_sample_fps: float = Field(default=5.0, ge=0.5, le=10.0)
              backend: Literal["openvino", "coreml"] = "openvino"
          ''',
              '''class DetectorConfig(BaseModel):
              enabled: bool = False
              # Native live analytics is deliberately opt-in. SurvNG Hybrid remains the
              # authoritative event tracker even when DL Streamer supplies short-term IDs.
              live_sample_fps: float = Field(default=5.0, ge=0.5, le=10.0)
              live_pipeline_inference_enabled: bool = False
              live_pipeline_inference_interval: int = Field(default=1, ge=1, le=5)
              live_pipeline_tracking: Literal["off", "short-term-imageless"] = "off"
              backend: Literal["openvino", "coreml"] = "openvino"
          ''',
          )

          replace(
              "survng/app/manager.py",
              '''                inference_device=detector.device,
                              # Qualification submits evidence to the priority-aware pool.
                              detect_enabled=False,
                              labels_path=detector.labels_path,
          ''',
              '''                inference_device=detector.device,
                              # Optional native live analytics experiment. DL Streamer may
                              # fill skipped-frame ROIs, but SurvNG Hybrid remains authoritative.
                              detect_enabled=(
                                  detector.enabled and detector.live_pipeline_inference_enabled
                              ),
                              inference_interval=detector.live_pipeline_inference_interval,
                              native_tracking=detector.live_pipeline_tracking,
                              labels_path=detector.labels_path,
          ''',
          )

          replace(
              "survng/app/dlstreamer_capture.py",
              '''    inference_device: str = "GPU"
              detect_enabled: bool = False
              frame_width: int = 320
          ''',
              '''    inference_device: str = "GPU"
              detect_enabled: bool = False
              inference_interval: int = 1
              native_tracking: str = "off"
              frame_width: int = 320
          ''',
          )

          replace(
              "survng/app/dlstreamer_capture.py",
              '''        if self.options.decoder not in {"auto", "va"}:
                          raise ValueError("decoder must be auto or va")
                      self._credential_warning_lock = threading.Lock()
          ''',
              '''        if self.options.decoder not in {"auto", "va"}:
                          raise ValueError("decoder must be auto or va")
                      if not 1 <= int(self.options.inference_interval) <= 5:
