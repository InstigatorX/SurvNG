name: Publish Docker image

on:
  push:
    branches:
      - v1.0
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  # Branch tip builds: keep only the newest commit. Release tags: never cancel.
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  publish:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runtime
            suffix: ""
          - target: runtime-intel
            suffix: "-intel"
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Self-hosted runners may lack docker-buildx. Keep the default (legacy)
      # builder; the Dockerfile avoids BuildKit-only features like COPY --chmod.
      - name: Build and push
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          short_sha="$(printf '%.7s' "${GIT_SHA}")"
          tags=()
          if [ "${REF_TYPE}" = "tag" ]; then
            tags+=("${image}:${REF_NAME}${SUFFIX}")
          else
            # Moving tip for the release line, plus an immutable commit pin.
            tags+=("${image}:v1.0${SUFFIX}")
            tags+=("${image}:sha-${short_sha}${SUFFIX}")
          fi

          primary="${tags[0]}"
          echo "Building ${TARGET} as ${primary}"
          docker build \
            --target "${TARGET}" \
            --build-arg "SURVNG_GIT_SHA=${GIT_SHA}" \
            --tag "${primary}" \
            .
          for tag in "${tags[@]:1}"; do
            docker tag "${primary}" "${tag}"
          done
          for tag in "${tags[@]}"; do
            docker push "${tag}"
            echo "Pushed ${tag}"
          done
