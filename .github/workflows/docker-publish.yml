name: Publish Docker image

on:
  push:
    branches:
      - v1.0
      - v1.1
      - v1.2
      - gstreamer
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # Branch tip builds: keep only the newest commit. Release tags: never cancel.
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  publish:
    if: github.ref_name != 'gstreamer'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: runtime
            suffix: ""
            dockerfile: Dockerfile
          - target: runtime-intel
            suffix: "-intel"
            dockerfile: Dockerfile
          - target: model-installer
            suffix: "-model-installer"
            dockerfile: Dockerfile.model-installer
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reclaim dangling Docker state
        run: scripts/github-runner-cleanup.sh --publish

      # Self-hosted runners may lack docker-buildx. Keep the default (legacy)
      # builder; the Dockerfile avoids BuildKit-only features like COPY --chmod.
      # Layer cache is local images left on the runner (do not --cache-from a
      # pulled GHCR tip: the legacy builder rejects that restore). Nightly
      # runner-maintenance still wipes unused cache.
      - name: Build and push
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
          GIT_SHA: ${{ github.sha }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: scripts/docker-publish-image.sh

  publish-gstreamer-intel:
    if: github.ref_name == 'gstreamer'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reclaim dangling Docker state
        run: scripts/github-runner-cleanup.sh --publish

      - name: Build and push Intel image
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          TARGET: runtime-intel
          SUFFIX: "-intel"
          GIT_SHA: ${{ github.sha }}
          DOCKERFILE: Dockerfile
        run: scripts/docker-publish-image.sh
