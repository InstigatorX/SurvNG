name: Publish Docker image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runtime
            suffix: ""
          - target: runtime-intel
            suffix: "-intel"
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          IMAGE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          full_tag="${image}:${IMAGE_TAG}${SUFFIX}"
          echo "Building ${TARGET} as ${full_tag}"
          docker build \
            --target "${TARGET}" \
            --build-arg "SURVNG_GIT_SHA=${GIT_SHA}" \
            --tag "${full_tag}" \
            .
          docker push "${full_tag}"
          echo "Pushed ${full_tag}"
