name: Native registry check

on:
  push:
    branches:
      - experiment/native-first-registry

jobs:
  full-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Build frontend assets
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Install test dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt pytest anyio httpx2
          sudo apt-get update
          sudo apt-get install -y             python3-gi gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0             gstreamer1.0-plugins-base gstreamer1.0-plugins-good             gstreamer1.0-plugins-bad gstreamer1.0-libav ffmpeg
      - name: Run full Python regression suite
        env:
          SURVNG_TEST_TIMEOUT_SECONDS: "900"
        run: |
          ./scripts/run-tests.sh -q
          python -m py_compile             survng/app/native_objects.py             survng/app/native_activity.py             survng/app/event_store/store.py             survng/app/zones.py             survng/dlstreamer_live.py
          git diff --check
