name: Native architecture campaign

on:
  push:
    branches:
      - experiment/native-first-arch-campaign

jobs:
  full-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Build frontend assets
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Install Python and media dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt pytest anyio httpx2
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav ffmpeg
      - name: Run full regression suite
        env:
          SURVNG_TEST_TIMEOUT_SECONDS: "900"
        run: |
          ./scripts/run-tests.sh -q
          python -m py_compile \
            survng/app/native_activity.py \
            survng/app/native_objects.py \
            survng/app/native_admission.py \
            survng/app/native_evidence.py \
            survng/app/native_evidence_common.py \
            survng/app/native_main_frame.py \
            survng/app/native_event_projection.py \
            survng/app/native_camera.py \
            survng/app/native_runtime.py \
            survng/app/event_store/store.py \
            survng/app/config_application.py \
            survng/dlstreamer_live.py \
            survng/native_pipeline/metadata.py \
            survng/app/dlstreamer_capture.py \
            survng/app/dlstreamer_supervisor.py
          git diff --check
