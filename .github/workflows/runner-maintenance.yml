name: Runner maintenance

on:
  schedule:
    # Nightly cleanup before typical US/EU morning pushes.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Cleanup mode
        type: choice
        options:
          - light
          - standard
          - aggressive
        default: light

permissions:
  contents: read

jobs:
  cleanup:
    # Node 24 actions require Actions Runner >= 2.327.1.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Clean runner disk
        run: |
          MODE="${{ github.event.inputs.mode || 'light' }}"
          scripts/github-runner-cleanup.sh "--${MODE}"
