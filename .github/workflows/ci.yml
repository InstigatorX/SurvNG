name: CI

on:
  push:
  pull_request:

# A branch with an open PR receives both push and pull_request events.  The
# Python runner serializes test campaigns for safety, so allowing both jobs to
# wait on the same lock can make the second job hit its per-suite timeout.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Runner diagnostics
        run: |
          whoami
          hostname
          pwd
          python --version
          node --version
      - name: Free runner disk space
        run: scripts/github-runner-cleanup.sh --light
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build frontend static assets
        run: npm --prefix frontend run build
      - name: Install Python test dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt pytest anyio
      - name: Run focused Python tests
        run: |
          scripts/run-tests.sh \
            tests/test_event_store.py \
            tests/test_app_lifespan.py \
            tests/test_frontend_routes.py \
            tests/test_recorder.py \
            tests/test_face_store.py \
            tests/test_calibration.py \
            tests/test_live_delivery.py \
            tests/test_inference.py \
            tests/test_inference_lifecycle.py \
            tests/test_object_tracking.py \
            tests/test_camera_worker.py \
            tests/test_config_reload.py
      - name: Run frontend unit tests
        run: node frontend/tests/run-tests.mjs unit
      - name: Post-job cleanup
        if: always()
        run: scripts/github-runner-cleanup.sh --light
