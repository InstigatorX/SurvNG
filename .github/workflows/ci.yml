name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Runner diagnostics
        run: |
          whoami
          hostname
          pwd
          python --version
          node --version
      - name: Free runner disk space
        run: scripts/github-runner-cleanup.sh --publish
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build frontend static assets
        run: npm --prefix frontend run build
      - name: Install Python test dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt pytest anyio httpx2
      - name: Run Python regression suite
        run: |
          scripts/run-tests.sh -q
      - name: Run frontend unit tests
        run: node frontend/tests/run-tests.mjs unit
      - name: Post-job cleanup
        if: always()
        run: scripts/github-runner-cleanup.sh --publish

  native-gstreamer:
    # No camera, GPU, model download, production state, or self-hosted service.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Real Intel GStreamer metadata and multistream smoke test
        run: |
          docker run --rm --network none --cpus 2 --memory 2g \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /bin/bash -v "$PWD:/work:ro" -w /work \
            intel/dlstreamer:2026.2.0-ubuntu24@sha256:3848efe52c047cf6b5961eb070deaf9eca53bd5328f0d819fbb68ad56c65fb19 \
            -lc 'PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/work:$PYTHONPATH python3 scripts/gstreamer-smoke.py'
