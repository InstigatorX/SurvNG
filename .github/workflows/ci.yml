name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    # Node 24 actions require Actions Runner >= 2.327.1.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Runner diagnostics
        run: |
          whoami
          hostname
          pwd
          python --version
          node --version
      - name: Free runner disk space
        run: scripts/github-runner-cleanup.sh --publish
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build frontend static assets
        run: npm --prefix frontend run build
      - name: Install Python test dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt pytest anyio httpx2
      - name: Run focused Python tests
        run: |
          scripts/run-tests.sh \
            tests/test_event_store.py \
            tests/test_camera_semantics*.py \
            tests/test_app_lifespan.py \
            tests/test_frontend_routes.py \
            tests/test_recorder.py \
            tests/test_calibration.py \
            tests/test_live_delivery.py \
            tests/test_detector*.py \
            tests/test_detection*.py \
            tests/test_depth_estimation.py \
            tests/test_inference.py \
            tests/test_inference_lifecycle.py \
            tests/test_object_tracking.py \
            tests/test_camera_worker.py \
            tests/test_config_reload.py
      - name: Run face and identity regression tests
        run: |
          scripts/run-tests.sh \
            tests/test_face*.py \
            tests/test_identity*.py \
            tests/test_unknown_identity*.py \
            tests/test_timeline_identity.py
      - name: Run local observability regression tests
        run: scripts/run-tests.sh tests/test_local_observability.py tests/test_camera_status.py
      - name: Run motion subsystem regression tests
        run: |
          scripts/run-tests.sh \
            tests/test_motion*.py \
            tests/test_ema*.py \
            tests/test_adaptive_motion.py \
            tests/test_capture_protocols.py \
            tests/test_onvif_inspector.py \
            tests/test_recorded_object_detection.py \
            tests/test_recorded_decode_budget.py \
            tests/test_object_motion.py \
            tests/test_stationary_policy.py \
            tests/test_config.py \
            tests/test_zones.py \
            tests/test_training_routes.py \
            tests/test_appearance_backfill.py \
            tests/test_model_evaluation.py
      - name: Run tracking evaluation regression tests
        run: |
          scripts/run-tests.sh \
            tests/test_tracking_evaluation.py \
            tests/test_tracking_candidate.py \
            tests/test_tracking_comparison.py \
            tests/test_object_tracking_lifecycle.py \
            tests/test_tracking_frames.py \
            tests/test_tracking_limiter.py
      - name: Install optional CPU tracking test runtime
        run: |
          .venv/bin/pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -r requirements-ultralytics-tracking.txt
      - name: Run native replacement adapter tests
        run: scripts/run-tests.sh tests/test_ultralytics_replacement_adapters.py
      - name: Run frontend unit tests
        run: node frontend/tests/run-tests.mjs unit
      - name: Post-job cleanup
        if: always()
        run: scripts/github-runner-cleanup.sh --publish
