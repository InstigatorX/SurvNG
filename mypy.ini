# Scoped type checking for central lifecycle/storage modules.
# Run: .venv/bin/mypy   (checks only the files listed below)
# Imported modules outside this list are analysed silently for types but not
# reported, so the scope can grow one module at a time.
[mypy]
python_version = 3.12
files =
    survng/app/main_database.py,
    survng/app/database_polling.py,
    survng/app/telemetry_store.py,
    survng/app/bind_policy.py,
    survng/app/camera_lifecycle.py,
    survng/app/recording_lifecycle.py
follow_imports = silent
ignore_missing_imports = True
warn_unused_ignores = True
